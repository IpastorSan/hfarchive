# local-model-backup — model catalog
#
# Every repo id below was verified against the Hugging Face Hub API.
# `approx_bytes` is the size of the files that the include/exclude globs
# actually match (not the whole repo). Refresh it any time with:
#
#     python -m lmb --refresh-sizes
#
# Fields per entry:
#   id           stable local name, used by --only / --exclude / --enable
#   hf_repo      canonical Hub repo id (exact casing)
#   revision     optional git revision (branch, tag or commit); default: main
#   include      optional glob list; if set, ONLY matching files are downloaded
#   exclude      optional glob list, applied after include
#   category     top-level folder on the destination drive
#   tags         used by profiles
#   license      as reported by the Hub
#   gated        true if the repo needs accepted terms + an HF token
#   approx_bytes matched bytes (generated; see --refresh-sizes)
#   enabled      false = skipped unless a profile opts in, or --enable is used
#   notes        why these globs, substitutions, hardware hints
#
# NOTE ON GLOBS: Hub patterns are fnmatch-style and `*` DOES cross `/`.
# So `*.safetensors` also matches `transformer/x.safetensors`. To exclude a
# single root-level file you must name it exactly.

defaults:
  min_free_gb: 50          # refuse to download with less headroom than this
  large_repo_gb: 100       # entries at/above this need --allow-large
  jobs: 2                  # repos downloaded in parallel
  max_workers_per_repo: 8  # files in parallel within one repo

profiles:
  tweet:
    description: >-
      DEFAULT. Every model from Dustin Hollywood's tweet. Multiple terabytes:
      the huge FP8/8-bit dumps stay enabled but are gated behind --allow-large.
    any_tags: [tweet]

  tweet-gguf:
    description: Only the GGUF / local-friendly rows from the tweet.
    all_tags: [tweet, gguf]

  domestic-coding:
    description: >-
      Coding models that actually run on a domestic ATX box (16-32 GB VRAM
      class), plus the tweet's coding GGUFs.
    any_tags: [coding-small]
    include_disabled: true

  current-box:
    description: >-
      Fits Ignacio's current box today: RTX 2070 Super 8 GB VRAM + 128 GB DDR5.
      MoE GGUFs are included because low active-parameter counts run well on CPU.
    any_tags: [current-box]
    include_disabled: true

  all:
    description: Everything marked enabled in this file.
    all: true

