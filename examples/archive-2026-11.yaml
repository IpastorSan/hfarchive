# Local model archive, November 2026
#
# Open-weight models to archive on external drives, chosen to run on three
# consumer hardware tiers:
#
#   tier-8gb   8 GB VRAM (Turing-class, no bf16/FP8/FP4) + ~128 GB RAM.
#              GGUF everywhere; big MoE models keep their experts in RAM.
#   tier-16gb  16 GB VRAM (e.g. 4060 Ti / 5060 Ti 16 GB) + 64-128 GB RAM.
#   tier-24gb  24 GB VRAM (3090 / 4090; a few entries need a 32 GB card,
#              noted per entry) + 128 GB RAM.
#
# An entry is tagged with every tier the model is practical on. Entries
# that run only slowly on a tier (dense 27-31B models on 8 GB) are not
# tagged with it. `core` is the set worth keeping first; `extended` adds
# bigger quants, second copies and niche models.
#
# Image and video models are split into one entry per file: the diffusion
# model, each text encoder, VAE and upscaler. Components used by several
# models (flux2-vae, qwen_3_4b, flux1-ae, t5xxl) have one entry each.
#
# Every repo id and file below was checked against the Hugging Face Hub API
# on 2026-11-13. `approx_bytes` is the size of the files the globs match.
# Licences are recorded as the Hub reports them; several are non-commercial
# or regionally restricted, so read them before using a model.
#
# Fields per entry:
#   id           stable local name, used by --only / --exclude / --enable
#   hf_repo      canonical Hub repo id (exact casing)
#   revision     optional git revision (branch, tag or commit); default: main
#   include      optional glob list; if set, ONLY matching files are downloaded
#   exclude      optional glob list, applied after include
#   category     top-level folder on the destination drive
#   tags         used by profiles
#   license      as reported by the Hub
#   gated        true if the repo needs accepted terms + an HF token
#   approx_bytes matched bytes (generated; see --refresh-sizes)
#   enabled      false = skipped unless a profile opts in, or --enable is used
#   notes        why these globs, substitutions, hardware hints
#
# NOTE ON GLOBS: Hub patterns are fnmatch-style and `*` DOES cross `/`.
# Unsloth repos keep stub copies of the first shard under Shard_Rewrite/, so
# sharded quants are pinned by folder (`UD-IQ1_S/*`), never by `*UD-IQ1_S*`.

default_profile: core

defaults:
  min_free_gb: 50          # refuse to download with less headroom than this
  large_repo_gb: 100       # entries at/above this need --allow-large
  jobs: 2                  # repos downloaded in parallel
  max_workers_per_repo: 8  # files in parallel within one repo

profiles:
  core:
    description: >-
      DEFAULT. The models worth keeping first: LLMs for every tier,
      security, uncensored and decision models, and the main image and
      video models with their encoders and VAEs.
    any_tags: [core]

  extended:
    description: >-
      Core plus bigger quants, second copies, the largest MoE models and
      niche image/video models. Does not fit on one 2 TB drive.
    any_tags: [core, extended]

  llm:
    description: Every language model (general, security, uncensored, decision).
    any_tags: [llm]

  image-video:
    description: Every image and video model and component.
    any_tags: [image, video]

  tier-8gb:
    description: Practical on 8 GB VRAM + ~128 GB RAM.
    any_tags: [tier-8gb]

  tier-16gb:
    description: Practical on 16 GB VRAM + 64-128 GB RAM.
    any_tags: [tier-16gb]

  tier-24gb:
    description: Practical on 24 GB VRAM + 128 GB RAM.
    any_tags: [tier-24gb]

  all:
    description: Everything marked enabled in this file.
    all: true

models:

  # ================================================================== LLMs
  # Run with llama.cpp. MoE models: keep experts in RAM with --n-cpu-moe N
  # or -ot ".ffn_.*_exps.=CPU". Memory rule: VRAM + RAM >= file size + 10-20%.

