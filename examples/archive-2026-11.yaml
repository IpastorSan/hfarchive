# Local model archive, November 2026
#
# Open-weight models to archive on external drives, chosen to run on three
# consumer hardware tiers:
#
#   tier-8gb   8 GB VRAM (Turing-class, no bf16/FP8/FP4) + ~128 GB RAM.
#              GGUF everywhere; big MoE models keep their experts in RAM.
#   tier-16gb  16 GB VRAM (e.g. 4060 Ti / 5060 Ti 16 GB) + 64-128 GB RAM.
#   tier-24gb  24 GB VRAM (3090 / 4090; a few entries need a 32 GB card,
#              noted per entry) + 128 GB RAM.
#
# An entry is tagged with every tier the model is practical on. Entries
# that run only slowly on a tier (dense 27-31B models on 8 GB) are not
# tagged with it. `core` is the set worth keeping first; `extended` adds
# bigger quants, second copies and niche models.
#
# Image and video models are split into one entry per file: the diffusion
# model, each text encoder, VAE and upscaler. Components used by several
# models (flux2-vae, qwen_3_4b, flux1-ae, t5xxl) have one entry each.
#
# Every repo id and file below was checked against the Hugging Face Hub API
# on 2026-11-13. `approx_bytes` is the size of the files the globs match.
# Licences are recorded as the Hub reports them; several are non-commercial
# or regionally restricted, so read them before using a model.
#
# Fields per entry:
#   id           stable local name, used by --only / --exclude / --enable
#   hf_repo      canonical Hub repo id (exact casing)
#   revision     optional git revision (branch, tag or commit); default: main
#   include      optional glob list; if set, ONLY matching files are downloaded
#   exclude      optional glob list, applied after include
#   category     top-level folder on the destination drive
#   tags         used by profiles
#   license      as reported by the Hub
#   gated        true if the repo needs accepted terms + an HF token
#   approx_bytes matched bytes (generated; see --refresh-sizes)
#   enabled      false = skipped unless a profile opts in, or --enable is used
#   notes        why these globs, substitutions, hardware hints
#   usage        how to run it: runtime (a runtimes[].id), notes (settings
#                from the model card; anything else is marked (estimate)),
#                workflows (pinned ComfyUI workflow JSONs, image/video only)
#
# NOTE ON GLOBS: Hub patterns are fnmatch-style and `*` DOES cross `/`.
# Unsloth repos keep stub copies of the first shard under Shard_Rewrite/, so
# sharded quants are pinned by folder (`UD-IQ1_S/*`), never by `*UD-IQ1_S*`.

default_profile: core

guide: docs/models-2026-11.md

defaults:
  min_free_gb: 50          # refuse to download with less headroom than this
  large_repo_gb: 100       # entries at/above this need --allow-large
  jobs: 2                  # repos downloaded in parallel
  max_workers_per_repo: 8  # files in parallel within one repo

profiles:
  core:
    description: >-
      DEFAULT. The models worth keeping first: LLMs for every tier,
      security, uncensored and decision models, and the main image and
      video models with their encoders and VAEs.
    any_tags: [core]

  extended:
    description: >-
      Core plus bigger quants, second copies, the largest MoE models and
      niche image/video models. Does not fit on one 2 TB drive.
    any_tags: [core, extended]

  llm:
    description: Every language model (general, security, uncensored, decision).
    any_tags: [llm]

  image-video:
    description: Every image and video model and component.
    any_tags: [image, video]

  tier-8gb:
    description: Practical on 8 GB VRAM + ~128 GB RAM.
    any_tags: [tier-8gb]

  tier-16gb:
    description: Practical on 16 GB VRAM + 64-128 GB RAM.
    any_tags: [tier-16gb]

  tier-24gb:
    description: Practical on 24 GB VRAM + 128 GB RAM.
    any_tags: [tier-24gb]

  all:
    description: Everything marked enabled in this file.
    all: true

# Runtimes to archive next to the models. `ref` is a release tag where
# the project publishes releases (its commit is in `notes`), otherwise a
# commit sha. `release_assets` globs pick the Linux x64 and Windows CUDA
# builds from that release, plus the macOS arm64 (Apple Silicon) build where
# there is one. Tags work like model tags for profiles.
runtimes:
  - id: llama.cpp
    git: https://github.com/ggml-org/llama.cpp
    ref: b12359
    release_assets:
      - "llama-b12359-bin-ubuntu-cuda-*-x64.tar.gz"
      - "cudart-llama-b12359-bin-ubuntu-cuda-*-x64.tar.gz"
      - "llama-b12359-bin-win-cuda-*-x64.zip"
      - "cudart-llama-bin-win-cuda-*-x64.zip"
      - "llama-b12359-bin-macos-arm64.tar.gz"
    tags: [core, extended, llm, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      b12359 is the build of release v1.0.0 (2026-11-13): both point at commit
      b1b770d90d94cad9e9ea5b993bdbc383a522fb28. The v1.0.0 release itself only
      carries nightly-tag.txt, so the binaries come from b12359. CUDA 12.x
      builds cover Turing (RTX 20) upwards. Binaries: llama-server, llama-cli;
      --fit and --jinja are on by default in this build. macOS arm64 build:
      Metal on Apple Silicon, same binaries and flags. The tier tags assume an
      NVIDIA card; on a Mac, GPU and RAM share one pool, so a model fits when
      its file plus context fits in about three quarters of unified memory
      (estimate), and --n-cpu-moe has nothing to offload to.

  - id: ComfyUI
    git: https://github.com/Comfy-Org/ComfyUI
    ref: v0.45.0
    release_assets:
      - "ComfyUI_windows_portable_nvidia.7z"
      - "ComfyUI_windows_portable_nvidia_cu126.7z"
    tags: [core, extended, image, video, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      comfyanonymous/ComfyUI now redirects to Comfy-Org/ComfyUI. v0.45.0 =
      commit 989d93d0d968e704c589ce0146bb18c77f6b50cc (latest release; tags up
      to v0.45.3 exist without releases). Linux has no release asset: install
      the archived wheels (wheels-v0.45.0/INSTALL.md). Windows: the portable 7z
      (cu126 build for older drivers), or the wheels. The README at v0.45.0
      recommends stable PyTorch from the cu130 index (required on RTX 20 and
      newer; GTX 10 cards need cu126, as in the cu126 portable). torch 2.14.1
      is the newest stable release on that index; torchaudio has been in
      maintenance since 2.9 and the index's newest build is 2.11.0. Python
      3.12: supported by ComfyUI, vLLM and transformers alike. macOS (Apple
      Silicon, macOS 14+): no release asset; the wheels pin the same torch
      versions from PyPI, which use the GPU through MPS (the README asks for a
      nightly; stable is what can be pinned). On MPS, ComfyUI loads fp8
      weights at 16 bits (comfy/model_management.py), so fp8 files take about
      twice their size in memory; GGUF and bf16 files load as they are.
    wheels:
      python: "3.12"
      platforms: [manylinux_2_28_x86_64, win_amd64, macosx_14_0_arm64]
      requirements: [requirements.txt]
      # CUDA builds for Linux and Windows; PyPI's builds (MPS) for macOS, which
      # the cu130 index does not carry.
      packages: ["torch==2.14.1+cu130; sys_platform != 'darwin'",
                 "torchvision==0.29.1+cu130; sys_platform != 'darwin'",
                 "torchaudio==2.11.0+cu130; sys_platform != 'darwin'",
                 "torch==2.14.1; sys_platform == 'darwin'",
                 "torchvision==0.29.1; sys_platform == 'darwin'",
                 "torchaudio==2.11.0; sys_platform == 'darwin'"]
      index_url: https://download.pytorch.org/whl/cu130
      extra_index_urls: [https://pypi.org/simple]
      start: |
        From the unpacked source: `.venv/bin/python main.py` (Windows:
        `.venv\Scripts\python main.py`). Point it at the archived models with
        `--extra-model-paths-config`, starting from extra_model_paths.yaml.example.

  - id: ComfyUI-GGUF
    git: https://github.com/city96/ComfyUI-GGUF
    ref: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    tags: [core, extended, image, video, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      city96's GGUF loader nodes (UnetLoaderGGUF, CLIPLoaderGGUF). No releases;
      pinned to the head of main (2026-01-12). Clone into ComfyUI/custom_nodes
      and `pip install -r requirements.txt` (gguf package). Its tools/ folder
      converts and quantizes image models.
    wheels:
      python: "3.12"
      platforms: [manylinux_2_28_x86_64, win_amd64, macosx_14_0_arm64]
      requirements: [requirements.txt]
      start: |
        Unpack the source into ComfyUI's custom_nodes/ folder and install these
        wheels into ComfyUI's .venv instead of a new one (skip the venv step);
        its pins were resolved alongside ComfyUI's. If pip reports a conflict,
        install by name from both wheelhouses: `python -m pip install
        --no-index --find-links <ComfyUI wheels>/<platform> --find-links <these
        wheels>/<platform> gguf sentencepiece protobuf`.

  - id: ComfyUI-GGUF-molbal
    git: https://github.com/molbal/ComfyUI-GGUF
    ref: v26-10-30
    tags: [core, image, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      Fork of city96/ComfyUI-GGUF with Krea 2 support; needed by krea2-turbo-*.
      v26-10-30 = commit da5f435cd9a9e54ad27eed417ed72b1f2543ef41 (the release
      has no assets). Install it instead of city96's pack when running Krea 2
      (both register the same node names). Its requirements add comfy-kitchen,
      which ComfyUI already pins. Its INT4 (W4A4) and Triton K-quant backends
      are CUDA only; on macOS the GGUF quants run through the plain loader.
    wheels:
      python: "3.12"
      platforms: [manylinux_2_28_x86_64, win_amd64, macosx_14_0_arm64]
      requirements: [requirements.txt]
      start: |
        Unpack the source into ComfyUI's custom_nodes/ folder and install these
        wheels into ComfyUI's .venv instead of a new one (skip the venv step);
        its pins were resolved alongside ComfyUI's. If pip reports a conflict,
        install by name from both wheelhouses: `python -m pip install
        --no-index --find-links <ComfyUI wheels>/<platform> --find-links <these
        wheels>/<platform> gguf sentencepiece protobuf comfy-kitchen`.

  - id: stable-diffusion.cpp
    git: https://github.com/leejet/stable-diffusion.cpp
    ref: master-1091-b9d7176
    release_assets:
      - "sd-master-b9d7176-bin-win-cuda12-x64.zip"
      - "cudart-sd-bin-win-cu12-x64.zip"
      - "sd-master-b9d7176-bin-Linux-Ubuntu-26.04-x86_64-vulkan.zip"
      - "sd-master-b9d7176-bin-Linux-Ubuntu-26.04-x86_64.zip"
      - "sd-master-b9d7176-bin-Darwin-macOS-*-arm64.zip"
    tags: [core, extended, image, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      master-1091-b9d7176 = commit b9d7176bf88fe465576e0aafbe47ba253ffcfc2c.
      There is no Linux CUDA build: use the Vulkan build (works on NVIDIA) or
      build with -DSD_CUDA=ON. Binary: sd-cli. Model guides in docs/
      (qwen_image_2.1.md, minimax_h3_image.md). The macOS arm64 build is
      configured without -DSD_METAL=ON, which docs/build.md gives for running
      on the Apple GPU: rebuild from the archived source with it for Metal.

  - id: edge0
    git: https://github.com/Edge0-AI/Edge0
    ref: v0.2.0
    release_assets:
      - "edge0-chat-0.2.0-windows-x64.zip"
    tags: [extended, llm, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      v0.2.0 = commit 3203c39809586d6629280706dde6b9c59809ad29. The only x64
      asset is the Windows Edge0 Chat app. Linux: build edge0-strata
      (edge0-strata/EDGE0.md, CUDA 13) and edge0-infer
      (edge0-infer/docs/getting-started.md). 145B/120B need an NVIDIA GPU of
      compute 7.5+ with 16 GiB+ VRAM and the CUDA 13 toolkit (release notes).
      macOS (Apple Silicon): no release asset; build edge0-infer with `cmake
      --preset mac-metal` (README). It runs edge0-35b only, on Metal or CPU.

  - id: vllm
    git: https://github.com/vllm-project/vllm
    ref: v0.32.0
    release_assets:
      - "vllm-0.32.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl"
      - "vllm-0.32.0-cp38-abi3-manylinux_2_28_x86_64.whl"
    tags: [extended, llm, tier-8gb, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      v0.32.0 = commit 5df63a7203cdb9328d824a27b682e77c7b9928be, the latest
      stable release (v0.33.0rc3 is newer but a release candidate). Used by
      openjev-flash-9b, whose card pins vllm==0.29.0. The wheels below are the
      PyPI build of vllm 0.32.0 (the same file as the plain release asset) with
      its dependencies: torch 2.13.0 and the CUDA 13 libraries, ~4 GB, plus
      openai and httpx at the versions the openjev card pins for its shim.
      Linux only: vLLM has no Windows build. manylinux_2_31 because llguidance
      ships no older Linux wheel, so the host needs glibc 2.31 or newer (Ubuntu
      20.04+). The +cu129 release asset needs a cu129 torch, which is not in
      this set.
    wheels:
      python: "3.12"
      platforms: [manylinux_2_31_x86_64]
      packages: ["vllm==0.32.0", "openai==3.26.0", "httpx==0.28.1"]
      start: |
        The vllm wheel is in the set, so the source is not needed to run it:
        `vllm-v0.32.0/.venv/bin/vllm serve <model folder>`. Run it from
        outside vllm-v0.32.0/, where Python would import the unbuilt source.

  - id: transformers
    git: https://github.com/huggingface/transformers
    ref: v5.22.2
    tags: [extended, llm, tier-16gb, tier-24gb]
    enabled: true
    notes: |
      v5.22.2 = commit 6d195c6262a0ac2ef44f7b9a308617562286ff45 (no release
      assets; install from the checkout or PyPI). Used by clef-omni, whose card
      was tested with transformers 5.10.2 and torch 2.11. The wheels pin the
      same torch 2.14.1 (cu130) as ComfyUI, plus accelerate for
      device_map="auto" offload and pillow and av for clef-omni's image, audio
      and video inputs; ~3 GB. Linux only: clef-omni needs ~64 GB of GPU memory
      or CPU offload, which is a Linux workstation job.
    wheels:
      python: "3.12"
      platforms: [manylinux_2_28_x86_64]
      packages: ["transformers==5.22.2", "torch==2.14.1+cu130", "torchvision==0.29.1+cu130",
                 "accelerate", "pillow", "av"]
      index_url: https://download.pytorch.org/whl/cu130
      extra_index_urls: [https://pypi.org/simple]
      start: |
        The transformers wheel is in the set: use `transformers-v5.22.2/.venv/bin/python`
        from outside transformers-v5.22.2/ (inside it, Python would import the
        source tree instead).

models:

  # ================================================================== LLMs
  # Run with llama.cpp. MoE models: keep experts in RAM with --n-cpu-moe N
  # or -ot ".ffn_.*_exps.=CPU". Memory rule: VRAM + RAM >= file size + 10-20%.

  - id: qwen3.8-flash-next-ud-q3kxl
    hf_repo: unsloth/Qwen3.8-Flash-Next-GGUF
    include:
      - UD-Q3_K_XL/*
      - mmproj-F16.gguf
      - README.md
    category: llm
    tags: [core, llm, tier-8gb, tier-16gb, tier-24gb]
    license: other
    gated: false
    approx_bytes: 90369012966
    enabled: true
    notes: >-
      125B / 6B-active MoE with vision. Needs ~8 GB VRAM + 96 GB RAM. The
      repo is ~1.9 TB; this keeps one quant plus the vision projector.
    usage:
      runtime: llama.cpp
      notes: |
        Sampling (Qwen card): thinking (default) temp 1.0, top_p 0.95, top_k 20,
        min_p 0, presence_penalty 0; non-thinking temp 0.7, top_p 0.8, top_k 20,
        presence_penalty 1.5 via --chat-template-kwargs
        '{"enable_thinking":false}'. --reasoning-effort xhigh (default) | medium
        | low; preserve_thinking is on. Context 262,144 native (1M with YaRN).
        8 GB: llama-server -m UD-Q3_K_XL/<first shard> --mmproj mmproj-F16.gguf
        -c 32768 --n-cpu-moe 99 (all experts in RAM; lower N until VRAM is full)
        (estimate); ~96 GB RAM.
    benchmarks:
      - name: "SWE-bench Pro"
        score: 62.5
        source: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
        date: 2026-11-13
        note: "self-reported; Claude Code harness"
      - name: "SWE-bench Verified"
        score: 78.7
        source: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
        date: 2026-11-13
        note: "measured by NVIDIA (Nemotron 3.5 card)"
      - name: "DeepSWE 1.1"
        score: 58.7
        source: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
        date: 2026-11-13
        note: "self-reported; best of Claude Code and mini-SWE-agent"
      - name: "Terminal-Bench 2.1"
        score: 86.1
        source: https://artificialanalysis.ai/leaderboards/models
        date: 2026-11-13
        note: "measured by Artificial Analysis; Terminus 2"
      - name: "Terminal-Bench 4.0"
        score: 25.3
        source: https://artificialanalysis.ai/leaderboards/models
        date: 2026-11-13
        note: "measured by Artificial Analysis; mini-swe-agent"
      - name: "FrontierCode 2.0"
        score: 27.1
        source: https://artificialanalysis.ai/leaderboards/models
        date: 2026-11-13
        note: "measured by Artificial Analysis; Stirrup harness"
      - name: "LiveCodeBench v6"
        score: 91.9
        source: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
